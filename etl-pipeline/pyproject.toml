[project]
name = "bytebites-etl"
version = "0.1.0"
description = "ByteBites Google Places ETL pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=0.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "pymongo>=4.10.0",
    "tenacity>=9.0.0",
    "structlog>=25.0.0",
    "pymysql>=1.2.0",
    "cryptography>=48.0.0",
    "qdrant-client>=1.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
