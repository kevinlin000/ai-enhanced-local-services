name: Portfolio CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-java:
    name: Backend Java
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run contract tests
        run: TAPPAY_PARTNER_KEY=test TAPPAY_MERCHANT_CREDITCARD=test mvn -B test

  ai-service-python:
    name: AI Service Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service-python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run tests
        run: uv run pytest tests -q

  etl-pipeline:
    name: ETL Pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl-pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run tests
        run: uv run pytest tests -q

  data-quality-gate:
    name: Data Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify portfolio data-quality evidence
        run: python3 scripts/verify-data-quality.py

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit/design contract tests
        run: pnpm test
      - name: Build
        run: pnpm build:ci
