name: Clean MySQL Migration Smoke

on:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: "Seconds to wait for Java health after starting from a clean MySQL schema"
        required: false
        default: "180"

jobs:
  clean-mysql-migration-smoke:
    name: Clean MySQL Migration Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Start MySQL for clean migration smoke
        run: |
          docker run -d \
            --name bytebites-ci-mysql \
            -e MYSQL_ROOT_PASSWORD=password \
            -p 3306:3306 \
            --health-cmd "mysqladmin ping -h127.0.0.1 -P3306 -uroot -ppassword --silent" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 40 \
            mysql:8.0

      - name: Wait for MySQL
        run: |
          for attempt in {1..60}; do
            status="$(docker inspect -f '{{.State.Health.Status}}' bytebites-ci-mysql)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            printf 'waiting for MySQL health, attempt=%s status=%s\n' "$attempt" "$status"
            sleep 2
          done
          docker logs bytebites-ci-mysql
          exit 1

      - name: Run clean MySQL migration smoke
        env:
          TAPPAY_PARTNER_KEY: test
          TAPPAY_MERCHANT_CREDITCARD: test
        run: |
          scripts/smoke-clean-mysql-migrations.sh \
            --mysql-container bytebites-ci-mysql \
            --timeout "${{ github.event.inputs.timeout_seconds || '180' }}" \
            --java-port 18081
