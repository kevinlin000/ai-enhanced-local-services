[project]
name = "bytebites-ai"
version = "0.1.0"
description = "ByteBites AI service - RAG and agent layer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.12.0",
    "google-genai>=0.3.0",
    "tenacity>=9.0.0",
    "prometheus-client>=0.21.0",
    "starlette-prometheus>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
