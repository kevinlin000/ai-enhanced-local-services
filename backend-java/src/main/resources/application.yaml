server:
  port: 8081
spring:
  application:
    name: bytebites
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "original heima dianping schema"
    locations: classpath:db/migration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hmdp}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASS:admin}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
        default-requeue-rejected: false
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.bytebites.entity # 别名扫描包
logging:
  level:
    com.bytebites: debug
    com.bytebites.service.impl.ShopServiceImpl: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: bytebites-java

line:
  oauth:
    client-id: ${LINE_CHANNEL_ID:placeholder_channel_id}
    client-secret: ${LINE_CHANNEL_SECRET:placeholder_channel_secret}
    redirect-uri: ${LINE_REDIRECT_URI:http://localhost:8081/api/auth/line/callback}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
    authorize-url: https://access.line.me/oauth2/v2.1/authorize
    token-url: https://api.line.me/oauth2/v2.1/token
    verify-url: https://api.line.me/oauth2/v2.1/verify
    scope: profile openid

jwt:
  secret: ${JWT_SECRET:change-me-in-production-this-is-only-for-dev-environment-must-be-at-least-256-bits}
  ttl-hours: ${JWT_TTL_HOURS:168}

tappay:
  partner-key: ${TAPPAY_PARTNER_KEY}
  api-base: ${TAPPAY_API_BASE:https://sandbox.tappaysdk.com}
  merchant-credit-card: ${TAPPAY_MERCHANT_CREDITCARD}
